  - main [ref=f10e42]:
    - generic [ref=f10e43]:
      - paragraph [ref=f10e44]: Our Heritage & Story
      - heading "Crafting the Future of Sustainable Packaging" [level=1] [ref=f10e45]
      - paragraph [ref=f10e46]: eSailor is an export-focused manufacturer of eco-friendly jute bags and customized textile packaging, bridging sustainable farming with global commercial retail.
    - generic [ref=f10e47]:
      - generic [ref=f10e48]:
        - heading "Roots in the Golden Fiber Belt" [level=2] [ref=f10e49]
        - paragraph [ref=f10e50]: "Founded in West Bengal, India — the epicenter of the world's finest jute cultivation — eSailor began with a simple yet ambitious vision: to replace single-use plastic packaging with 100% natural, biodegradable, and durable jute products that withstand international commercial demands."
        - paragraph [ref=f10e51]: Over the years, we have grown from a localized weaving unit into a comprehensive export facility equipped with modern semi-automated looms, precision laser cutting tables, non-toxic water-based screen printing setups, and rigorous multi-stage quality control laboratories.
      - generic [ref=f10e52]:
        - heading "Global Export Experience" [level=2] [ref=f10e53]
        - paragraph [ref=f10e54]: With over 15 years of dedicated foreign trade experience, eSailor has delivered over 12 million custom bags to commercial importers, major supermarket chains, promotional marketing agencies, and luxury fashion brands across 25+ countries, including Germany, the United Kingdom, the United States, Japan, the UAE, and Australia.
        - paragraph [ref=f10e55]: Our export desk possesses deep institutional knowledge of international trade documentation, Incoterms (FOB, CIF, CFR, DDP), Certificate of Origin procedures, and strict chemical compliance standards (REACH, GOTS, OEKO-TEX).
      - generic [ref=f10e56]:
        - heading "Strategic Location & Port Proximity" [level=2] [ref=f10e57]
        - paragraph [ref=f10e58]: Our primary manufacturing operations and warehousing centers are located in the industrial corridor of Greater Kolkata, West Bengal, India.
        - generic [ref=f10e59]:
          - heading "Logistics Advantage" [level=3] [ref=f10e60]
          - paragraph [ref=f10e61]: Situated within 45 kilometers of Kolkata's Syama Prasad Mookerjee Sea Port and Netaji Subhash Chandra Bose International Airport, our facility ensures rapid container loading, reduced inland haulage time, and dependable sailing schedules for 20ft and 40ft High Cube containers.
      - generic [ref=f10e62]:
        - heading "Commitment to People & Planet" [level=2] [ref=f10e63]
        - generic [ref=f10e64]:
