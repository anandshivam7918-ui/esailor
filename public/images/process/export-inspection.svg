<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#1C150E"/>
  <!-- Shipping Container Outline -->
  <rect x="80" y="80" width="440" height="240" rx="8" fill="#2C2218" stroke="#4A3B2C" stroke-width="2"/>
  <!-- Corrugated Container Lines -->
  <line x1="130" y1="80" x2="130" y2="320" stroke="#3D3023" stroke-width="3"/>
  <line x1="180" y1="80" x2="180" y2="320" stroke="#3D3023" stroke-width="3"/>
  <line x1="230" y1="80" x2="230" y2="320" stroke="#3D3023" stroke-width="3"/>
  <line x1="280" y1="80" x2="280" y2="320" stroke="#3D3023" stroke-width="3"/>
  <line x1="330" y1="80" x2="330" y2="320" stroke="#3D3023" stroke-width="3"/>
  <line x1="380" y1="80" x2="380" y2="320" stroke="#3D3023" stroke-width="3"/>
  <line x1="430" y1="80" x2="430" y2="320" stroke="#3D3023" stroke-width="3"/>
  <!-- Master Export Carton with Pallet Strapping -->
  <rect x="220" y="140" width="160" height="130" rx="4" fill="#D49A5B" stroke="#9A6532" stroke-width="2"/>
  <line x1="300" y1="140" x2="300" y2="270" stroke="#1C150E" stroke-width="2" stroke-dasharray="4 2"/>
  <line x1="220" y1="205" x2="380" y2="205" stroke="#1C150E" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- AQL Passed Stamp -->
  <circle cx="340" cy="180" r="32" stroke="#52796F" stroke-width="3" fill="#24332B" opacity="0.95"/>
  <text x="320" y="186" fill="#74A892" font-family="sans-serif" font-size="14" font-weight="bold">PASSED</text>
  <text x="325" y="196" fill="#FAF7F2" font-family="sans-serif" font-size="8">AQL 1.5/2.5</text>
  <!-- Port & Dispatch Badges -->
  <rect x="40" y="340" width="220" height="32" rx="6" fill="#FAF7F2" opacity="0.1"/>
  <text x="50" y="361" fill="#FAF7F2" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">KOLKATA PORT (CCU) DISPATCH</text>
  <rect x="380" y="340" width="180" height="32" rx="6" fill="#FAF7F2" opacity="0.1"/>
  <text x="390" y="361" fill="#C37D3E" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">FUMIGATED PALLETS</text>
</svg>
