<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="400" fill="#242820"/>
  <!-- Loom Frame Structure -->
  <rect x="70" y="60" width="460" height="280" rx="10" fill="#1C1F18" stroke="#4A5240" stroke-width="2"/>
  <!-- Warp Threads (Vertical) -->
  <line x1="120" y1="90" x2="120" y2="310" stroke="#D49A5B" stroke-width="2" opacity="0.7"/>
  <line x1="150" y1="90" x2="150" y2="310" stroke="#D49A5B" stroke-width="2" opacity="0.7"/>
  <line x1="180" y1="90" x2="180" y2="310" stroke="#D49A5B" stroke-width="2" opacity="0.7"/>
  <line x1="210" y1="90" x2="210" y2="310" stroke="#D49A5B" stroke-width="2" opacity="0.7"/>
  <line x1="240" y1="90" x2="240" y2="310" stroke="#D49A5B" stroke-width="2" opacity="0.7"/>
  <line x1="270" y1="90" x2="270" y2="310" stroke="#D49A5B" stroke-width="2" opacity="0.7"/>
  <!-- Shuttle Bar -->
  <rect x="255" y="70" width="16" height="260" rx="4" fill="#C37D3E"/>
  <circle cx="263" cy="200" r="4" fill="#FAF7F2"/>
  <!-- Woven Fabric Matrix (Horizontal Weft Dense Weave) -->
  <rect x="290" y="90" width="210" height="220" rx="4" fill="#C17F42" stroke="#8A5C22" stroke-width="1.5"/>
  <line x1="290" y1="120" x2="500" y2="120" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>
  <line x1="290" y1="150" x2="500" y2="150" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>
  <line x1="290" y1="180" x2="500" y2="180" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>
  <line x1="290" y1="210" x2="500" y2="210" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>
  <line x1="290" y1="240" x2="500" y2="240" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>
  <line x1="290" y1="270" x2="500" y2="270" stroke="#FAF7F2" stroke-width="1" opacity="0.4"/>
  <!-- Badges -->
  <rect x="40" y="340" width="220" height="32" rx="6" fill="#FAF7F2" opacity="0.1"/>
  <text x="50" y="361" fill="#FAF7F2" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">SHUTTLELESS LOOM WEAVE</text>
  <rect x="390" y="340" width="170" height="32" rx="6" fill="#FAF7F2" opacity="0.1"/>
  <text x="400" y="361" fill="#C37D3E" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="1">320-450 GSM DENSITY</text>
</svg>
