<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <pattern id="stitchingWeave" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0,6 L12,6 M6,0 L6,12" stroke="#B88647" stroke-width="1.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#F7F3EC"/>

  <!-- Jute Fabric Base Plate -->
  <rect x="120" y="80" width="560" height="440" rx="8" fill="#D9A86C"/>
  <rect x="120" y="80" width="560" height="440" rx="8" fill="url(#stitchingWeave)"/>

  <!-- Padded Handle Webbing Strap Overlay -->
  <rect x="280" y="80" width="240" height="440" fill="#EAE4D5" stroke="#C4B89F" stroke-width="2"/>
  <!-- Handle Ribbing Texture -->
  <g stroke="#C4B89F" stroke-width="2" stroke-dasharray="4,4">
    <line x1="310" y1="80" x2="310" y2="520"/>
    <line x1="340" y1="80" x2="340" y2="520"/>
    <line x1="370" y1="80" x2="370" y2="520"/>
    <line x1="400" y1="80" x2="400" y2="520"/>
    <line x1="430" y1="80" x2="430" y2="520"/>
    <line x1="460" y1="80" x2="460" y2="520"/>
    <line x1="490" y1="80" x2="490" y2="520"/>
  </g>

  <!-- Big Reinforced Box-X Stitch Detail -->
  <g transform="translate(300, 160)">
    <!-- Box boundary (Double Stitched) -->
    <rect x="0" y="0" width="200" height="240" rx="4" fill="none" stroke="#2D5038" stroke-width="6"/>
    <rect x="8" y="8" width="184" height="224" rx="2" fill="none" stroke="#2D5038" stroke-width="3" stroke-dasharray="8,6"/>

    <!-- Cross X Stitches (Double Stitched) -->
    <line x1="8" y1="8" x2="192" y2="232" stroke="#2D5038" stroke-width="6"/>
    <line x1="192" y1="8" x2="8" y2="232" stroke="#2D5038" stroke-width="6"/>

    <!-- Corner Rivet Reinforcements -->
    <circle cx="8" cy="8" r="7" fill="#C17F42"/>
    <circle cx="192" cy="8" r="7" fill="#C17F42"/>
    <circle cx="8" cy="232" r="7" fill="#C17F42"/>
    <circle cx="192" cy="232" r="7" fill="#C17F42"/>
    <circle cx="100" cy="120" r="8" fill="#C17F42"/>
  </g>

  <!-- Load Rating Marker Tag -->
  <g transform="translate(480, 360)">
    <rect width="180" height="80" rx="8" fill="#1B4332" stroke="#C17F42" stroke-width="2"/>
    <text x="90" y="32" font-family="sans-serif" font-size="11" font-weight="bold" fill="#C17F42" text-anchor="middle" letter-spacing="1">TENSILE TESTED</text>
    <text x="90" y="60" font-family="'DM Serif Display', Georgia, serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">25 KG LOAD</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 40)">
    <rect width="250" height="50" rx="6" fill="#FFFFFF" fill-opacity="0.95" stroke="#CBD5E0"/>
    <text x="16" y="22" font-family="sans-serif" font-size="10" font-weight="bold" fill="#C17F42">REINFORCED HANDLE SEAM</text>
    <text x="16" y="38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2A241C">Automated Heavy Lockstitch</text>
  </g>
</svg>
