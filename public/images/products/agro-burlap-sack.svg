<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4EEE1"/>
      <stop offset="100%" stop-color="#E2D6C0"/>
    </linearGradient>
    <linearGradient id="burlapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A87739"/>
      <stop offset="50%" stop-color="#C59253"/>
      <stop offset="100%" stop-color="#9C6B2F"/>
    </linearGradient>
    <pattern id="coarseBurlap" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M0,8 L16,8 M8,0 L8,16" stroke="#754E1E" stroke-width="2.5" stroke-opacity="0.4"/>
      <circle cx="4" cy="4" r="1.5" fill="#5E3C14" fill-opacity="0.3"/>
      <circle cx="12" cy="12" r="1.5" fill="#5E3C14" fill-opacity="0.3"/>
    </pattern>
    <filter id="dropShadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#261A0C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad4)"/>
  <ellipse cx="400" cy="525" rx="210" ry="24" fill="#261A0C" opacity="0.2"/>

  <!-- Sack Body (Industrial Commodity Shape) -->
  <g filter="url(#dropShadow4)">
    <path d="M260,190 C260,170 320,165 400,165 C480,165 540,170 540,190 C560,300 550,440 530,500 C470,515 330,515 270,500 C250,440 240,300 260,190 Z" fill="url(#burlapGrad)"/>
    <path d="M260,190 C260,170 320,165 400,165 C480,165 540,170 540,190 C560,300 550,440 530,500 C470,515 330,515 270,500 C250,440 240,300 260,190 Z" fill="url(#coarseBurlap)"/>

    <!-- Gathered Neck Tied with Heavy Jute Twine -->
    <ellipse cx="400" cy="190" rx="90" ry="16" fill="#8A5B23"/>
    <path d="M310,190 C330,205 470,205 490,190" fill="none" stroke="#E6D3B1" stroke-width="12" stroke-linecap="round"/>
    <path d="M310,190 C330,205 470,205 490,190" fill="none" stroke="#7A5222" stroke-width="2" stroke-dasharray="4,4"/>
    <!-- Twine Knot & Tassels -->
    <circle cx="470" cy="195" r="14" fill="#E6D3B1"/>
    <path d="M470,195 L495,240 M470,195 L460,245" stroke="#E6D3B1" stroke-width="8" stroke-linecap="round"/>

    <!-- Overlocked Side Seam -->
    <path d="M260,200 C245,300 255,440 270,500" fill="none" stroke="#4A3114" stroke-width="3" stroke-dasharray="6,4"/>
    <path d="M540,200 C555,300 545,440 530,500" fill="none" stroke="#4A3114" stroke-width="3" stroke-dasharray="6,4"/>

    <!-- Commodity Stencil Print -->
    <rect x="310" y="270" width="180" height="90" rx="4" fill="none" stroke="#241708" stroke-width="2" stroke-dasharray="8,4" stroke-opacity="0.6"/>
    <text x="400" y="300" font-family="'DM Serif Display', Georgia, serif" font-size="20" font-weight="bold" fill="#241708" fill-opacity="0.8" text-anchor="middle">ARABICA COFFEE</text>
    <text x="400" y="325" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="3" fill="#241708" fill-opacity="0.75" text-anchor="middle">60 KG NETT</text>
    <text x="400" y="345" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="1" fill="#241708" fill-opacity="0.65" text-anchor="middle">HYDROCARBON FREE</text>

    <!-- Shipping Green Line -->
    <line x1="290" y1="410" x2="510" y2="410" stroke="#2E5A36" stroke-width="10" stroke-opacity="0.7"/>
  </g>

  <!-- Export Spec Badge -->
  <g transform="translate(620, 40)">
    <rect width="140" height="60" rx="8" fill="#FFFFFF" fill-opacity="0.9" stroke="#DDD4C4" stroke-width="1"/>
    <text x="14" y="24" font-family="sans-serif" font-size="10" font-weight="bold" fill="#C17F42" letter-spacing="1">AGRO SPEC</text>
    <text x="14" y="44" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2A241C">420 GSM TWILL</text>
  </g>
</svg>
